<!DOCTYPE html>

<html>

<head>
    <title>Form Page</title>
</head>

<body>

    <h1>Form Page</h1>

    <!-- Link back to home -->
    <a href="index.html">Back to Home</a>

    <p>Please fill out the form below.</p>

    <form>

        <fieldset>

            <legend>User Information</legend>

            <!-- Text input -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <br><br>

            <!-- Required password input -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <br><br>

            <!-- Single selection -->
            <p>Favorite Programming Language:</p>

            <input type="radio" id="cpp" name="language" value="cpp">
            <label for="cpp">C++</label>

            <input type="radio" id="python" name="language" value="python">
            <label for="python">Python</label>

            <input type="radio" id="java" name="language" value="java">
            <label for="java">Java</label>

            <br><br>

            <!-- Large multiline text input -->
            <label for="comments">Comments:</label>
            <br>
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>

            <br><br>

            <!-- Submit button -->
            <button type="submit">Submit</button>

        </fieldset>

    </form>

</body>

</html>
